[project]
name = "domainexbot"
version = "0.1.0"
description = "DomainExBot API for domain expiration monitoring and management."
authors = [
    { name = "YmNIK" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "psycopg2-binary>=2.9.11",
    "redis>=7.1.0",
    "python-whois>=0.9.6",
    "pydantic-settings>=2.12.0",
    "python-jose>=3.5.0",
    "loguru>=0.7.3",
    "sentry-sdk>=2.49.0",
    "bcrypt>=5.0.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "pydantic[email]>=2.12.5",
    "alembic>=1.18.1",
    "pyjwt[crypto]>=2.10.1",
]

[project.scripts]
app-cli = "app.cli.__main__:main"
